[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smrpgpatchbuilder"
version = "7.1.15"
authors = [
  { name="pidgezero_one", email="s.kischak@gmail.com" },
]
description = "Patchable base class support for some SMRPG concepts similar to their definitions in Lazy Shell"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies=[]

[project.optional-dependencies]
# Only the dis/assembler CLIs (run from a repo checkout) need Django.
cli = ["Django>=5.1"]

[project.urls]
Homepage = "https://github.com/pidgezero-one/smrpgpatchbuilder"
Issues = "https://github.com/pidgezero-one/smrpgpatchbuilder/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smrpgpatchbuilder*"]
# CLI dis/assemblers are a repo-checkout workflow, not part of the importable API.
exclude = ["smrpgpatchbuilder.management*"]

[tool.pytest.ini_options]
addopts = "-v -s"
